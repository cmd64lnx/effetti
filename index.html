<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Effetti">
<meta name="theme-color" content="#15151a">
<link rel="manifest" href="manifest.webmanifest">
<title>Effetti</title>
<style>
:root{--bg:#15151a;--pad:#25252e;--tx:#f4f4f6;--mut:#9a9aa6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Helvetica Neue",sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;justify-content:flex-end;padding:8px 12px 0}
#edit{font:600 15px inherit;font-family:inherit;color:var(--mut);background:none;border:1.5px solid #3a3a46;border-radius:10px;padding:7px 14px}
#edit.on{color:#15151a;background:#f2c94c;border-color:#f2c94c}
#grid{flex:1;display:grid;gap:12px;padding:12px;grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(4,1fr);min-height:0}
@media (orientation:landscape){#grid{grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(2,1fr)}}
.pad{--c:#888;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:14px 14px 22px;background:var(--pad);border-radius:20px;font-weight:700;font-size:clamp(22px,5.2vmin,44px);line-height:1.15;letter-spacing:-.01em;overflow-wrap:anywhere;overflow:hidden;transition:background .06s,color .06s}
.pad::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:var(--c)}
.pad.on{background:var(--c);color:#15151a}
.pad.on::after{background:#15151a33}
.pad.empty{color:var(--mut)}
.pad input{width:100%;font:inherit;font-size:clamp(18px,4vmin,30px);text-align:center;color:var(--tx);background:#15151a;border:1.5px solid #3a3a46;border-radius:12px;padding:10px}
.pad label{font-size:16px;font-weight:600;color:#15151a;background:var(--c);border-radius:10px;padding:10px 16px}
</style>
</head>
<body>
<header><button id="edit">Modifica</button></header>
<main id="grid"></main>
<script>
const N=8,COL=['#e5484d','#f08a24','#f2c94c','#3fb87f','#2fc4c9','#3e8ef7','#9b6cf0','#e86aa8'];
const AC=window.AudioContext||window.webkitAudioContext;
const ctx=new AC();
let bufs=Array(N).fill(null),recs=Array(N).fill(null),playing=Array(N).fill(false),els=[],edit=false;
let names=Array.from({length:N},(_,i)=>'Effetto '+(i+1));
const grid=document.getElementById('grid'),editBtn=document.getElementById('edit');

const db=new Promise((res,rej)=>{const r=indexedDB.open('fx',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(mode,f)=>{const d=await db;return new Promise((res,rej)=>{const t=d.transaction('p',mode);const r=f(t.objectStore('p'));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error)})};
const save=i=>tx('readwrite',s=>s.put({name:names[i],data:recs[i]||null},i)).catch(()=>{});
const dec=ab=>new Promise((res,rej)=>ctx.decodeAudioData(ab.slice(0),res,rej));

function unlock(){
  try{navigator.audioSession.type='playback'}catch(e){}
  if(ctx.state!=='running')ctx.resume();
  try{if(navigator.wakeLock&&!unlock.wl){navigator.wakeLock.request('screen').then(l=>{unlock.wl=l;l.onrelease=()=>unlock.wl=null}).catch(()=>{})}}catch(e){}
}
function mark(i){if(els[i])els[i].classList.toggle('on',playing[i])}
function play(i){
  if(!bufs[i]||playing[i])return;
  unlock();
  const s=ctx.createBufferSource();
  s.buffer=bufs[i];s.connect(ctx.destination);
  playing[i]=true;
  s.onended=()=>{playing[i]=false;mark(i)};
  s.start(0);mark(i);
}
async function load(i,file){
  if(!file)return;
  try{
    const ab=await new Promise((r,j)=>{const x=new FileReader();x.onload=()=>r(x.result);x.onerror=j;x.readAsArrayBuffer(file)});
    const b=await dec(ab);
    bufs[i]=b;recs[i]=ab;
    if(/^Effetto \d$/.test(names[i]))names[i]=file.name.replace(/\.[^.]+$/,'');
    await save(i);
  }catch(e){alert('Non riesco a leggere questo file audio. Prova con un mp3 o un m4a.')}
  render();
}
function render(){
  grid.innerHTML='';els=[];
  for(let i=0;i<N;i++){
    const d=document.createElement('div');
    d.className='pad'+(bufs[i]?'':' empty');
    d.style.setProperty('--c',COL[i]);
    if(edit){
      const n=document.createElement('input');
      n.value=names[i];n.maxLength=40;
      n.onchange=()=>{names[i]=n.value.trim()||'Effetto '+(i+1);save(i)};
      const l=document.createElement('label');
      l.textContent=bufs[i]?'Cambia audio':'Carica audio';
      const f=document.createElement('input');
      f.type='file';f.accept='audio/*';f.hidden=true;
      f.onchange=()=>load(i,f.files[0]);
      l.append(f);d.append(n,l);
    }else{
      d.textContent=bufs[i]?names[i]:names[i]+' (vuoto)';
      d.onpointerdown=()=>play(i);
    }
    grid.append(d);els.push(d);mark(i);
  }
}
editBtn.onclick=()=>{edit=!edit;editBtn.textContent=edit?'Fine':'Modifica';editBtn.classList.toggle('on',edit);render()};
document.addEventListener('pointerdown',unlock);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){unlock.wl=null;unlock()}});

render();
(async()=>{
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  for(let i=0;i<N;i++){
    try{
      const r=await tx('readonly',s=>s.get(i));
      if(r){names[i]=r.name||names[i];if(r.data){recs[i]=r.data;bufs[i]=await dec(r.data)}}
    }catch(e){}
  }
  render();
})();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
